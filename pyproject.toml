[project]
name = "labgen"
version = "0.1.0"
description = "Video of a real chemistry bench -> a metrically correct Isaac Lab scene in the robot base frame."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Kept deliberately thin. Isaac Lab 3.0 Beta 2 pins its own torch and a long
# tail of transitive deps; anything listed here must be safe to have present in
# that environment. See CLAUDE.md "Do not pip install into the Isaac Lab
# environment casually" -- labgen core is import-clean without Isaac Lab, and
# without pxr.
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Only needed for T5 (registration) and T6 (identification). Not imported by
# labgen core, so CI for milestone one does not install them.
vision = [
    "opencv-contrib-python>=4.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
labgen = "labgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "isaaclab: requires a working Isaac Lab install; skipped elsewhere",
    "slow: settle tests and other multi-second physics checks",
]

[tool.uv]
# CLAUDE.md: known dependency conflicts with stale mujoco / mujoco-warp / newton
# wheels in the pip cache. labgen core does not depend on them, but if this env
# is ever layered onto Isaac Lab, purge first.
package = true
